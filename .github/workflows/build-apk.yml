
name: Build Handy Pair Matcher Android v0.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'HandyPairMatcher_Android_Handy_v03.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q HandyPairMatcher_Android_Handy_v03.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: HandyPairMatcherAndroid
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HandyPairMatcher-Android-v03-debug-apk
          path: HandyPairMatcherAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
