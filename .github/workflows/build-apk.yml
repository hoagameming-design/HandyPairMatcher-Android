
name: Build HandyPairMatcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "HandyPairMatcher_Android_Build_Ready.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q HandyPairMatcher_Android_Build_Ready.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: HandyPairMatcherAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandyPairMatcher-debug-apk
          path: HandyPairMatcherAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
